<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Luminous Robotics Team</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF; --fg: #1B2740; --muted: #5B6B85; --navy: #1B2E4F; --accent: #1C7FB0; --border: #E3E8F0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10182B; --fg: #E9EEF7; --muted: #94A1BE; --navy: #C6D5EE; --accent: #4FA8D6; --border: #2A3654;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: 'Work Sans', Arial, sans-serif;
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
}
.wrap { max-width: 420px; }
img { width: 72px; height: 72px; margin-bottom: 18px; }
.code { font-family: 'Anton', Arial, sans-serif; font-size: 64px; color: var(--accent); line-height: 1; }
h1 { font-family: 'Anton', Arial, sans-serif; font-weight: 400; font-size: 24px; color: var(--navy); margin: 10px 0; }
p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
a.btn {
  display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
  font-weight: 700; font-size: 14px; padding: 12px 22px; border-radius: 999px;
}
</style>
</head>
<body>
  <div class="wrap">
    <img src="assets/logo.png" alt="Luminous">
    <div class="code">404</div>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığın sayfa taşınmış veya hiç var olmamış olabilir.</p>
    <a class="btn" href="/">Ana Sayfaya Dön</a>
  </div>
</body>
</html>
